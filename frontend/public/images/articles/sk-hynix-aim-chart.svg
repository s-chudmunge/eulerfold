<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="barOld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="barNew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>
  
  <rect width="600" height="400" fill="url(#bg)" rx="12" />
  
  <text x="300" y="50" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">LLM Inference Power Consumption</text>
  <text x="300" y="80" font-family="system-ui, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Standard Architecture vs. SK Hynix GDDR6-AiM</text>
  
  <!-- Y Axis -->
  <line x1="100" y1="120" x2="100" y2="320" stroke="#cbd5e1" stroke-width="2" />
  <line x1="100" y1="320" x2="500" y2="320" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Bars -->
  <rect x="180" y="140" width="80" height="180" fill="url(#barOld)" rx="4" />
  <rect x="340" y="284" width="80" height="36" fill="url(#barNew)" rx="4" />
  
  <!-- Labels -->
  <text x="220" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">GPU + GDDR6</text>
  <text x="220" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">(Traditional)</text>
  
  <text x="380" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f766e" text-anchor="middle">GDDR6-AiM</text>
  <text x="380" y="365" font-family="system-ui, sans-serif" font-size="12" fill="#0d9488" text-anchor="middle">(Processing-In-Memory)</text>
  
  <!-- Arrow and 80% reduction text -->
  <path d="M 270 200 Q 340 200 360 260" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  
  <rect x="270" y="180" width="100" height="30" fill="#fee2e2" rx="4" stroke="#fca5a5" />
  <text x="320" y="201" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">-80% Power</text>
</svg>
